name: 의사과학자 키워드 모니터링

on:
  schedule:
    # KST 09:00 = UTC 00:00
    - cron: '0 0 * * *'
  workflow_dispatch:   # 수동 실행 버튼 활성화

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # CSV 자동 커밋에 필요

    steps:
      # 1. 저장소 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 의존성 설치
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4

      # 4. 모니터링 스크립트 실행
      - name: Run monitor
        env:
          GMAIL_ADDRESS:     ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:      ${{ secrets.NOTIFY_EMAIL }}
        run: python monitor.py

      # 5. news_archive.csv 변경 시 자동 커밋
      - name: Commit updated archive
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news_archive.csv monitor.log || true
          git diff --staged --quiet || git commit -m "chore: 아카이브 업데이트 $(date +'%Y-%m-%d %H:%M KST' -d '+9 hours')"
          git push
